name: documentation

on:
  workflow_run:
    workflows: ["csl consumption CI"]
    types: [completed]
    # branches matches the triggering run's branch (see csl-consumption-ci.yml).
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qqy
          sudo apt-get install -y graphviz

      - name: Generate documentation
        run: bash doc/scripts/generate_doc.sh

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: doc/output
