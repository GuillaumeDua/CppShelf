name: csl release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; only the packaging job needs write (to create the release).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  # Release gate: the tagged tree must pass the full CI matrix and the consumption suite.
  # These workflows do not trigger on tag pushes, so we run them here against the tag.
  ci:
    name: CI
    uses: ./.github/workflows/csl-ci.yml

  consumption:
    name: Consumption
    needs: ci
    uses: ./.github/workflows/csl-consumption-ci.yml

  package:
    name: Package & release
    needs: [ci, consumption] # only runs if both gates succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required to create a GitHub release

    env:
      build_dir: ${{ github.workspace }}/build/release

    steps:
    - uses: actions/checkout@v4

    - name: Install ninja
      run: |
        sudo apt-get update -qqy
        sudo apt-get install -y ninja-build

    - name: 📦 Configure, build and package (CPack)
      run: |
        cmake -S . -B "${{ env.build_dir }}" -G Ninja \
          -DCMAKE_BUILD_TYPE=Release                  \
          -DCSL_TEST=OFF                              \
          -DCSL_EXAMPLE=OFF                           \
          -DCSL_BENCHMARK=OFF                         \
          -DCSL_DOC=OFF                               \
          -DCSL_INSTALL=ON
        cmake --build "${{ env.build_dir }}"
        cmake --build "${{ env.build_dir }}" --target package

    - name: List archives
      run: ls -1 "${{ env.build_dir }}"/csl-*.tar.gz "${{ env.build_dir }}"/csl-*.zip

    - name: 🚀 Create GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}"        \
          --title "csl ${GITHUB_REF_NAME}"            \
          --generate-notes                            \
          "${{ env.build_dir }}"/csl-*.tar.gz         \
          "${{ env.build_dir }}"/csl-*.zip
